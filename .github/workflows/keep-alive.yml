name: Supabase keep-alive

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 */2 * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call keep-alive endpoint
        env:
          KEEP_ALIVE_URL: ${{ secrets.KEEP_ALIVE_URL }}
        run: |
          test -n "$KEEP_ALIVE_URL"
          curl --fail --silent --show-error --retry 3 "$KEEP_ALIVE_URL/api/keep-alive"
